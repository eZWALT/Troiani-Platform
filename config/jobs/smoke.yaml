name: platform-smoke
gpus: 1
min_gpu_memory_gb: 40
preferred_gpu_type: A100
priority: opportunistic
preemptible: true
checkpoint_interval: 10
checkpoint_every_steps: 20
max_runtime: 120
experiment: smoke
command:
  - python
  - -m
  - troiani_platform.training.dummy_train
  - --steps
  - "60"
  - --sleep
  - "0.1"
dataset:
  name: smoke-manifest
  version: "1"
