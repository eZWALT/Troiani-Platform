name: platform-smoke-atlas
gpus: 1
min_gpu_memory_gb: 40
preferred_gpu_type: A100
preferred_node: atlas
priority: opportunistic
preemptible: true
checkpoint_interval: 10
checkpoint_every_steps: 20
max_runtime: 120
experiment: smoke-1gpu
command:
  - python
  - -m
  - troiani_platform.training.dummy_train
  - --steps
  - "50"
  - --sleep
  - "0.1"
dataset:
  name: smoke-manifest
  version: "1"
