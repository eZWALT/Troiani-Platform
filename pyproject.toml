[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "troiani-platform"
version = "0.1.0"
description = "Cooperative preemptible training platform for Troiani"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "eZWALT" }]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0",
  "psutil>=5.9.0",
  "httpx>=0.27.0",
  "mlflow>=2.12.0",
  "tensorboard>=2.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.1.0",
]
train = [
  "torch",
]
docs = [
  "diagrams>=0.23",
]

[project.scripts]
troiani-platform = "troiani_platform.cli.main:app"
troiani = "troiani_platform.cli.main:troiani_app"

[tool.hatch.build.targets.wheel]
packages = ["src/troiani_platform"]

[tool.hatch.build.targets.sdist]
include = ["src/troiani_platform", "config", "docs", "scripts", "resources", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "simulation: in-process cluster simulation",
  "integration: multi-component flows",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
